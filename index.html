    <title>Crowd-Density Stampede Prevention System</title>
    <meta name="description" content="An AI-powered application to analyze crowd density from images and live video to predict and prevent potential stampedes. It calculates people per square meter and assigns a color-coded risk level." />
    <meta property="og:title" content="Crowd-Density Stampede Prevention System" />
    <meta property="og:description" content="An AI-powered application to analyze crowd density from images and live video to predict and prevent potential stampedes. It calculates people per square meter and assigns a color-coded risk level." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Functional Colors (Risk Levels)
              safe: '#22C55E',      // Emerald Green
              warning: '#EAB308',   // Amber Yellow
              danger: '#DC2626',    // Crimson Red

              // Dark Mode Palette
              background: '#0F172A', // Charcoal Black
              panel: '#1E293B',      // Gunmetal
              'text-primary': '#F9FAFB',  // Snow White
              'text-secondary': '#94A3B8', // Slate Gray
              'border-accent': '#334155',  // Deep Blue Gray

              // Accent Colors
              'cta-primary': '#2563EB',   // Deep Blue
              'cta-hover': '#1D4ED8',     // Royal Blue
              'success': '#86EFAC',     // Green Tint
              'error': '#F87171',       // Soft Red
            }
          }
        }
      }
    </script>
